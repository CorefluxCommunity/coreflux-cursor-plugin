name: Bug report
description: Something in the plugin, MCP server, hooks or a skill does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove any passwords, secrets or private hostnames before posting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - MCP server (coreflux-broker tools)
        - Hooks (session context / destructive-command guard)
        - Skill, rule, agent or command text
        - LoT linter (lot_lint)
        - Deployment (lot_deploy / lotnb_deploy / project_upload)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the tool call and the response (envelope JSON, error text).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The LoT or command that triggers it, copy-pastable.
      render: text
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From `plugins/coreflux/.cursor-plugin/plugin.json` or the Cursor plugin panel.
    validations:
      required: true
  - type: input
    id: broker-version
    attributes:
      label: Coreflux broker version
      description: Payload of `$SYS/Coreflux/Version` (`mqtt_read_retained`).
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Cursor 2.x on macOS 15, Node 22.12"
